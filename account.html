        <nav class="hidden items-center gap-8 text-sm uppercase tracking-[0.2em] text-zinc-300 md:flex">

        </nav>

<div class="flex items-center gap-3">

<button onclick="abrirBuscador()" class="text-white hover:opacity-70 transition">

<div class="max-w-7xl mx-auto p-10 grid md:grid-cols-4 gap-10">

  <!-- 🧭 MENU IZQUIERDO -->
  <div class="space-y-4">




     <div onclick="mostrarPedidos()" class="border border-white/10 p-4 rounded-lg cursor-pointer hover:bg-white hover:text-black transition">
        Mis pedidos
     </div>

      <div onclick="mostrarDatos()" class="border border-white/10 p-4 rounded-lg cursor-pointer hover:bg-white hover:text-black transition">
           Mis datos
      </div>

    <div onclick="logout()" class="border border-white/10 p-4 rounded-lg cursor-pointer hover:bg-red-500 transition">
      Cerrar sesión
    </div>

  </div>

  <!-- 📄 CONTENIDO -->




<div class="md:col-span-3">

  <!-- 🔹 SECCIÓN DATOS -->
  <div id="seccion-datos">

    <div class="flex justify-between items-center mb-6">
     <h2 class="text-2xl font-bold">Mi Perfil</h2>
      <button id="btnEditarPerfil" 
        class="border border-white/20 px-4 py-2 rounded-lg text-sm hover:bg-white hover:text-black transition">
        Editar
      </button>
    </div>
    <div class="border border-white/10 p-6 rounded-xl">
      <p class="text-sm text-zinc-400 mb-2">Correo</p>
      <p id="user-email" class="mb-4"></p>

<div class="flex gap-10 mb-4">

  <div>
    <p class="text-sm text-zinc-400">Nombre</p>
    <p id="user-name"></p>
  </div>

  <div>
    <p class="text-sm text-zinc-400">Apellido</p>
    <p id="user-apellido"></p>
  </div>

</div>


      <p class="text-sm text-zinc-400 mb-2">DNI</p>
      <p id="user-dni" class="mb-4"></p>

      <p class="text-sm text-zinc-400 mb-2">Teléfono</p>
      <p id="user-telefono"></p>
    </div>


<!-- 🔹 SECCIÓN editar datos -->
<div class="border border-white/10 p-6 rounded-xl mt-6">

  <div class="flex justify-between items-center mb-4">

    <button id="btnAgregarDireccion"

  </div>

  <div id="lista-direcciones" class="space-y-3 text-sm text-zinc-300">
    <p class="text-zinc-500">No tienes direcciones aún</p>
  </div>

</div>
  </div>
  <!-- 🔹 SECCIÓN PEDIDOS -->
  <div id="seccion-pedidos" class="hidden">
    <h2 class="text-2xl font-bold mb-6">Mis pedidos</h2>

</div>

  </div>

</div>

<div id="modalPerfil" class="fixed inset-0 bg-black/70 hidden justify-center items-center z-50">

  <div class="bg-[#111] border border-white/10 rounded-xl w-full max-w-lg p-6 relative">

    <!-- Cerrar -->
    <button id="cerrarPerfil" class="absolute top-3 right-3 text-white/60 hover:text-white">✖</button>

    <h2 class="text-xl font-semibold mb-4">Editar perfil</h2>

    <div class="grid gap-4">

      <div class="flex gap-2">
        <input id="editNombre" placeholder="Nombre" class="input w-full">
        <input id="editApellido" placeholder="Apellido" class="input w-full">
      </div>

      <input id="editCorreo" disabled class="input">

      <input id="editDni" placeholder="DNI" class="input">
      <input id="editTelefono" placeholder="Teléfono" class="input">

      <p class="text-xs text-zinc-500">
        Este correo se usa para iniciar sesión y actualizar pedidos.
      </p>

    </div>

    <div class="flex justify-end gap-3 mt-4">
      <button id="cancelarPerfil" class="text-zinc-400 hover:text-white">Cancelar</button>
      <button id="guardarPerfil" class="bg-white text-black px-4 py-2 rounded-lg font-semibold">
        Guardar
      </button>
    </div>

  </div>
</div>







<!-- 🔥 TU SCRIPT (DESPUÉS) -->
<div id="modalDireccion" class="fixed inset-0 bg-black/70 hidden justify-center items-center z-50">

  <div class="bg-[#111] border border-white/10 rounded-xl w-full max-w-lg p-6 relative">

    <!-- ❌ botón cerrar -->
    <button id="cerrarDireccion" class="absolute top-3 right-3 text-white/60 hover:text-white">✖</button>

    <h2 class="text-xl font-semibold mb-4">Agregar dirección</h2>







<div class="grid gap-4">

  <!-- Nombre + Apellido -->
  <div class="flex gap-4">
    <input id="dirNombre" placeholder="Nombre" class="input w-full">
    <input id="dirApellido" placeholder="Apellido" class="input w-full">
  </div>

  <!-- Dirección -->
  <input id="dirDireccion" placeholder="Dirección" class="input">

  <!-- Referencia -->
  <input id="dirReferencia" placeholder="Apartamento, referencia, etc. (opcional)" class="input">

  <!-- Ciudad + Región + Distrito -->
  <div class="flex gap-4">
    <input id="dirCiudad" placeholder="Ciudad" class="input w-full">

    <select id="dirRegion" class="input w-full">
      <option value="">Región</option>
      <option>Lima</option>
      <option>Arequipa</option>
      <option>Cusco</option>
      <option>La Libertad</option>
      <option>Piura</option>
    </select>

    <input id="dirDistrito" placeholder="Distrito" class="input w-full">
  </div>

  <!-- Teléfono -->
  <input id="dirTelefono" placeholder="Teléfono" class="input">

<div class="flex justify-between items-center mt-4">



<!-- predeterminada -->
           <button id="hacerPrincipal" 
              class="text-yellow-400 hover:text-yellow-300 text-sm hidden">
               ⭐ Hacer principal
           </button>
  
  <!-- 🗑️ ELIMINAR -->
  <button id="eliminarDireccion" 
    class="text-red-500 hover:text-red-400 text-sm hidden">
    Eliminar
  </button>

  <!-- DERECHA -->
  <div class="flex gap-4">
    <button id="cancelarDireccion" class="text-zinc-400 hover:text-white">
      Cancelar
    </button>

    <button id="guardarDireccion" class="bg-white text-black px-4 py-2 rounded-lg font-semibold">
      Guardar
    </button>
  </div>

</div>
