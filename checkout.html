<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/drayms.png" type="image/png">
  <title>Checkout - DRAYMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-black text-white">

<!-- HEADER -->
<header class="border-b border-white/10">

    
  <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-5">

    <!-- Logo -->
    <a href="index.html">
                <img src="img/drayms.png" alt="DRAYMS" class="h-14 w-auto object-contain hover:opacity-80 transition">
    </a>
    <h1 class="text-xs uppercase tracking-[0.3em] text-zinc-500">Compra Alaraka</h1>

    <!-- Grupo de botones -->
<div class="flex gap-4">
  <a href="index.html#productos"
     class="border border-white/20 px-6 py-2 rounded-full hover:bg-white hover:text-black transition">
    Seguir comprando
  </a>

  <a href="cart.html"
     class="border border-white/20 px-6 py-2 rounded-full hover:bg-white hover:text-black transition">
    ← Volver
  </a>
</div>

  </div>
</header>

<!-- CONTENEDOR -->
<div class="max-w-7xl mx-auto grid md:grid-cols-2">

  <!-- 🧾 IZQUIERDA (FORMULARIO) -->
  <div class="p-10">

    <h2 class="text-xl font-semibold mb-6">Contacto</h2>

    <input id="correo" placeholder="Email o teléfono"
      class="w-full mb-4 px-4 py-3 bg-[#0f0f0f] border border-[#2a2a2a] rounded-lg">

    <h2 class="text-xl font-semibold mt-8 mb-6">Entrega</h2>
    <!-- 📍 DIRECCIONES GUARDADAS -->
<div id="lista-direcciones" class="mb-6 space-y-3"></div>

    <div class="grid grid-cols-2 gap-4">
      <input id="nombre" placeholder="Nombre" class="input">
      <input id="apellidos" placeholder="Apellidos" class="input">
    </div>

     <input id="dni" placeholder="DNI" class="input mt-4">
     <input id="direccion" placeholder="Dirección" class="input mt-4">

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">

        <!-- CIUDAD -->
        <input 
    type="text" 
    value="LIMA"
    class="input uppercase"
  >

  <!-- REGIÓN -->
  <select id="region" class="input">
    <option value="">Región</option>
    <option>Lima (Metropolitana)</option>
    <option>Lima (Departamento)</option>
    <option>Arequipa</option>
    <option>La Libertad</option>
    <option>Lambayeque</option>
    <option>Piura</option>
    <option>Junín</option>
    <option>Ica</option>
    <option>Loreto</option>
  </select>

  <!-- DISTRITO -->
  <input 
    id="distrito"
    type="text" 
    placeholder="Distrito"
    class="input uppercase"
  >

</div>

     <input id="telefono" placeholder="Teléfono" class="input mt-4">


<!-- 🚚 MÉTODOS DE ENVÍO -->
<h2 class="text-xl font-semibold mt-8 mb-4">Métodos de envío</h2>

<div class="space-y-3">

  <!-- OPCIÓN 1 -->
  <label class="flex items-start justify-between border border-white/20 rounded-lg p-4 cursor-pointer hover:border-white transition">

    <div class="flex items-start gap-3">
      <input type="radio" name="envio" value="shalom" checked class="mt-1">

      <div>
        <p class="font-medium">📦 Shalom Provincias</p>
        <p class="text-sm text-zinc-400">
          No es gratis, el pago del envío es de aprox S/. 10.00 en agencia.
        </p>
      </div>
    </div>

    <p class="font-semibold">GRATIS</p>

  </label>

  <!-- OPCIÓN 2 -->
  <label class="flex items-start justify-between border border-white/20 rounded-lg p-4 cursor-pointer hover:border-white transition">

    <div class="flex items-start gap-3">
      <input type="radio" name="envio" value="olva" class="mt-1">

      <div>
        <p class="font-medium">🚚 Olva Provincias</p>
        <p class="text-sm text-zinc-400">
          Directo a domicilio
        </p>
      </div>
    </div>

    <p class="font-semibold">S/. 15.00</p>

  </label>

</div>




     </div>



     
  <!-- 📦 DERECHA -->
  <div class="bg-[#0a0a0a] border-l border-white/10 p-10">

    <!-- 🛒 PRODUCTOS -->
    <div id="resumen-carrito"></div>

    <!-- TOTAL -->
    <div class="border-t border-white/10 mt-6 pt-4">
      <div class="flex justify-between text-lg">
        <span>Total</span>
        <span id="total">S/. 0.00</span>
      </div>
    </div>
         <button onclick="copiarMonto()"
           class="w-full mt-3 border border-white py-1 rounded-full hover:bg-white hover:text-black transition text-sm">
            Copiar monto
          </button>
           <p id="mensaje-copiado" class="text-xs mt-2 text-zinc-500 text-center"></p>
              <!-- 🎟️ CÓDIGO DE DESCUENTO -->
          
<div class="mt-6">

  <div class="flex gap-2">
    <input id="codigo"
      placeholder="Código de descuento"
      class="flex-1 px-4 py-3 bg-[#0f0f0f] border border-[#2a2a2a] rounded-full text-sm">

    <button onclick="aplicarDescuento()"
      class="px-5 py-3 border border-white rounded-full hover:bg-white hover:text-black transition text-sm">
      Aplicar
    </button>
  </div>

  <p id="mensaje-descuento" class="text-xs mt-2 text-zinc-500">
    <!-- aquí saldrá el mensaje -->
  </p>

</div>


    <!-- 🔥 YAPE -->
    <div class="mt-8 text-center">

      <p class="mb-3 text-sm text-zinc-700">Paga con Yape</p>

      <img src="img/LOGO-NEGRO.jpg" class="w-48 md:w-56 mx-auto mb-4 rounded">

      
      <input 
        id="comprobante" 
        type="file" 
        class="hidden"
        accept="image/*"
        >

      <button onclick="seleccionarImagen()"
        class="w-full border border-white py-3 rounded-full hover:bg-white hover:text-black transition">
        Subir comprobante
        
      </button>

      <p id="file-name" class="text-xs mt-2 text-zinc-500">
        Ningún archivo seleccionado
      </p>

    </div>

    <!-- BOTÓN FINAL -->
    <button id="btn-confirmar" class="w-full mt-6 bg-white text-black py-4 rounded-full font-bold">
      Confirmar pedido
    </button>

  </div>

</div>

<style>
.input {
  width: 100%;
  padding: 12px;
  background: #0f0f0f;
  border: 1px solid #2a2a2a;
  border-radius: 20px;
}
</style>

<script>
  const buttons = document.querySelectorAll(".nav-btn");

  buttons.forEach(btn => {
    btn.addEventListener("click", function () {
      buttons.forEach(b => b.classList.remove("bg-white", "text-black"));
      this.classList.add("bg-white", "text-black");
    });
  });
</script>

<script type="module" src="checkout.js"></script>
</body>
</html>
